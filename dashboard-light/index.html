<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maison Orée — Back-Office Essentiel</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%2323211e'/%3E%3Cpath d='M9 24h22M13 24a7 7 0 0 1 14 0' stroke='%23c9a466' stroke-width='2' fill='none'/%3E%3C/svg%3E">

  <!-- Polices (identiques à Prestige FULL) -->
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <!-- Essentiel : Leaflet et Chart.js ne sont plus chargés -->

  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Maison Orée — tableau de bord">
      <svg viewBox="0 0 40 40" width="32" height="32" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="18.5" stroke="currentColor" stroke-width="1.2"/>
        <path d="M7 24h26" stroke="currentColor" stroke-width="1.2"/>
        <path d="M12 24a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.2"/>
        <path d="M20 10v3.5M13.5 13l1.8 1.8M26.5 13l-1.8 1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Maison Orée<span class="brand-ed">Essentiel</span></span>
    </a>

    <!-- 4 onglets (contre 9 dans Prestige FULL) -->
    <nav class="nav" id="nav" aria-label="Navigation principale">
      <a href="#/dashboard" data-route="dashboard">Tableau de bord</a>
      <a href="#/biens" data-route="biens">Biens</a>
      <a href="#/messages" data-route="messages">Messages <span class="count" id="nav-count" hidden></span></a>
      <a href="#/parametres" data-route="parametres">Paramètres</a>
    </nav>

    <div class="top-actions">
      <div class="segmented" data-pkg-toggle role="group" aria-label="Périmètre de démonstration" title="Périmètre affiché en démonstration client">
        <button data-pkg="essentiel">Essentiel</button>
        <button data-pkg="signature">Signature</button>
        <button data-pkg="full">Prestige FULL</button>
      </div>
      <button class="icon-btn" data-action="toggle-theme" aria-label="Changer de thème">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="avatar" href="#/parametres/profil" id="avatar" aria-label="Mon profil">YB</a>
    </div>
  </header>

  <main id="main">
    <section class="view" id="view-dashboard" aria-label="Tableau de bord"></section>
    <section class="view" id="view-biens" aria-label="Gestion des biens"></section>
    <section class="view" id="view-messages" aria-label="Messages et demandes"></section>
    <section class="view" id="view-parametres" aria-label="Paramètres"></section>
  </main>

  <div class="overlay" id="overlay-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal"></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="../assets/js/package.js?v=4"></script>
  <script src="data.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
